        source: { article: "Article 5(1)(d)" },
        items: [
          "Document that system only supports human assessment and does not replace human decision-making",
          "Maintain evidence that assessments are based on objective and verifiable facts",
          "Document that facts are directly linked to specific criminal activity",
          "Keep records of human oversight and final decision accountability"
        ],
      }
    X2:
      {
        title: "Medical/Safety Emotion Recognition Exemption Documentation",
        source: { article: "Article 5(1)(f)" },
        items: [
          "Document specific medical or safety purpose justification for emotion inference",
          "Maintain evidence of medical/safety context and necessity",
          "Keep records of medical professional involvement or safety protocol compliance",
          "Document that use is limited to medical/safety purposes only"
        ],
      }
    X3:
      {
        title: "Biometric Law Enforcement Exemption Documentation",
        source: { article: "Article 5(1)(g), Article 5(2-4)" },
        items: [
          "Document judicial or administrative authorization for each use",
          "Maintain records of strict temporal and geographical limitations",
          "Document compliance with all safeguards and conditions",
          "Keep records of human verification and oversight procedures"
        ],
      }
    X4:
