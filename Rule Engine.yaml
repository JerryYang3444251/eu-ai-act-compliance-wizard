        title: "Real-time Remote Biometric Identification Exemption Documentation",
        source: { article: "Article 5(1)(h), Article 5(2-4)" },
        items: [
          "Document specific law enforcement purpose and legal authorization",
          "Maintain records of urgency justification and authorization timing",
          "Document implementation of required safeguards and human oversight",
          "Keep detailed logs of each use including judicial review"
        ],
      }
    X5:
      {
        title: "Ancillary Feature Exemption Documentation",
        source: { article: "Recital 16" },
        items: [
          "Document objective technical reasons why the AI feature cannot be used without the principal service",
          "Maintain evidence that integration is not a means to circumvent the AI Act",
          "Document that the AI functionality is genuinely ancillary and secondary to the main service",
          "Keep records of technical architecture showing inseparable integration"
        ],
      }

