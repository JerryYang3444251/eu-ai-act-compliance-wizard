rules_engine:
  ###########################################################
  # DATA STRUCTURE REFERENCE — ANNEX III USE CASES
  ###########################################################
  # The following 29 specific use cases from Annex III are available:
  #
  # BIOMETRICS (3):
  #   - biometric_rbi: Remote biometric identification systems [III(1)(a)]
  #   - biometric_categorisation: Biometric categorisation based on sensitive attributes [III(1)(b)]
  #   - emotion_recognition: Emotion recognition [III(1)(c)]
  #
  # CRITICAL INFRASTRUCTURE (1):
  #   - critical_infrastructure: Safety components in critical infrastructure [III(2)]
  #
  # EDUCATION AND VOCATIONAL TRAINING (4):
  #   - education_access: Determining access or admission to educational institutions [III(3)(a)]
  #   - education_outcomes: Evaluating learning outcomes [III(3)(b)]
  #   - education_level: Assessing appropriate education level [III(3)(c)]
  #   - education_monitoring: Monitoring prohibited student behaviour during tests [III(3)(d)]
  #
  # EMPLOYMENT (2):
  #   - employment_recruitment: Recruitment or selection of natural persons [III(4)(a)]
  #   - employment_management: Work-related decisions, promotion, termination, monitoring [III(4)(b)]
  #
  # ESSENTIAL SERVICES (4):
  #   - services_public_benefits: Evaluating eligibility for public assistance benefits [III(5)(a)]
  #   - services_creditworthiness: Evaluating creditworthiness or credit score [III(5)(b)]
  #   - services_insurance: Risk assessment for life and health insurance [III(5)(c)]
  #   - services_emergency: Emergency call evaluation and dispatch prioritisation [III(5)(d)]
  #
  # LAW ENFORCEMENT (5):
  #   - law_victim_risk: Assessing risk of becoming a victim of crime [III(6)(a)]
  #   - law_polygraph: Polygraphs or similar tools [III(6)(b)]
  #   - law_evidence: Evaluating reliability of evidence [III(6)(c)]
  #   - law_offending_risk: Assessing risk of offending or re-offending [III(6)(d)]
  #   - law_profiling: Profiling in criminal investigations [III(6)(e)]
  #
  # MIGRATION, ASYLUM AND BORDER CONTROL (4):
  #   - migration_polygraph: Polygraphs in migration context [III(7)(a)]
  #   - migration_risk: Assessing security, irregular migration, or health risk [III(7)(b)]
  #   - migration_applications: Examining asylum/visa/residence applications [III(7)(c)]
  #   - migration_identification: Detecting/identifying persons in border control [III(7)(d)]
  #
  # ADMINISTRATION OF JUSTICE AND DEMOCRATIC PROCESSES (2):
  #   - justice_assistance: Assisting judicial authorities [III(8)(a)]
  #   - justice_elections: Influencing elections or voting behaviour [III(8)(b)]
  #
  ###########################################################

  # ---------------------------------------------------------------------------
  # SCREEN ROUTE MAPPING
  # YAML uses SCREEN_N labels. Code routes: SCREEN_2=/screen2, SCREEN_3=/screen3,
  # SCREEN_5=/screen4, SCREEN_6=/screen5, SCREEN_6b=/screen6, SCREEN_8=/screen7,
  # SCREEN_8b=/screen8, SCREEN_9=/screen9, SCREEN_10=/screen10,
  # SCREEN_11=/screen11, SCREEN_12=/screen13, SCREEN_14=/screen14.
  # (Screens 4 and above in the code are numbered two lower than in the YAML label.)
  # ---------------------------------------------------------------------------

  ###########################################################
  # MODULE 1 — EXCLUSIONS
  ###########################################################

  EXCL_001:
    rule_id: EXCL_001
    namespace: exclusions
    inputs: [answers.exclusions]
    condition: "answers.exclusions intersects ['military','R&D_only','opensource_free','personal_use','foreign_LE_only']"
    action:
      classification: "Excluded"
      add_obligations: "Exclusion_Documentation"  # Add M1-M5 documentation requirements
    next: SCREEN_12  # Screen12 detects Excluded and auto-redirects to /screenFinal
    notes: "Immediate scope removal per Article 2 material scope exclusions - but still requires documentation per M1-M5"

  EXCL_002:
    rule_id: EXCL_002
    namespace: exclusions
    inputs: [answers.exclusions]
    condition: "NOT (answers.exclusions intersects ['military','R&D_only','opensource_free','personal_use','foreign_LE_only'])"
    action: proceed
    next: SCREEN_2
    notes: "Continue only if not excluded under Article 2"

  ###########################################################
  # MODULE 2 — RAW ROLE DETERMINATION (USER INPUT ONLY)
  ###########################################################

  ROLE_001:
    rule_id: ROLE_001
    namespace: roles.raw
    inputs: [org_actions]
    condition: "org_actions intersects ['develop_system','develop_model','modify','change_purpose','fine_tune']"
    action: "add_role_raw('Development_Modification')"
    notes: "Any form of development or substantial modification"

  ROLE_002:
    rule_id: ROLE_002
    namespace: roles.raw
    inputs: [org_actions]
    condition: "org_actions contains 'brand'"
    action: "add_role_raw('Branding')"

  ROLE_003:
    rule_id: ROLE_003
    namespace: roles.raw
    inputs: [org_actions]
    condition: "org_actions contains 'import'"
    action: "add_role_raw('Importer')"

  ROLE_004:
    rule_id: ROLE_004
    namespace: roles.raw
    inputs: [org_actions]
    condition: "org_actions contains 'distribute'"
    action: "add_role_raw('Distributor')"

  ROLE_005:
    rule_id: ROLE_005
    namespace: roles.raw
    inputs: [org_actions]
    condition: "org_actions contains 'place_on_market'"
    action: "add_role_raw('Market_Placer')"

  ROLE_006:
    rule_id: ROLE_006
    namespace: roles.raw
    inputs: [org_actions]
    condition: "org_actions contains 'deploy'"
    action: "add_role_raw('Deployer')"

  ROLE_007:
    rule_id: ROLE_007
    namespace: roles.raw
    inputs: [org_actions]
    condition: "org_actions contains 'product_manufacturer'"
    action: "add_role_raw('Product_Manufacturer')"

  ROLE_008:
    rule_id: ROLE_008
    namespace: roles.raw
    condition: "roles_raw is empty"
    action: "error('At least one role must be selected.')"
    next: SCREEN_2

  ROLE_009:
    rule_id: ROLE_009
    namespace: roles.raw
    inputs: [org_actions]
    condition: "org_actions contains 'act_as_ar'"
    action: "add_role_raw('Authorised_Representative')"
    notes: "Acting as authorised representative for an EU-external provider (Article 22)"

  ###########################################################
  # MODULE 2B — LEGAL ROLE RECLASSIFICATION (EU AI ACT)
  # NOTE: 'roles_raw' in conditions below refers to roles_raw_TAGS (e.g.
  # 'Development_Modification'), not the raw org_actions array. The code
  # first calls identifyRawRoles() to produce role tags, then calls
  # reclassifyRoles() which uses those tags.
  # Key input variable mappings:
  #   ai_is_safety_component   → answers.safety_function == "yes"
  #   placing_under_own_name   → presence of 'Branding' raw-role tag
  #   modifications array      → presence of 'Development_Modification' tag
  ###########################################################

  ROLE_RECLASS_FLAG_INIT:
    rule_id: ROLE_RECLASS_FLAG_INIT
    namespace: roles.legal
    action: "provider_assigned = false"
    notes: "Tracking variable used in subsequent role rules"

  # BLOCK 1 — DEVELOPMENT/MODIFICATION → PROVIDER
  ROLE_RECLASS_001:
    rule_id: ROLE_RECLASS_001
    namespace: roles.legal
    inputs: [roles_raw]
    condition: "roles_raw contains 'Development_Modification'"
    action:
      - "add_role('Provider')"
      - "provider_assigned = true"
    notes: "Articles 3 & 16 — developers and modifiers are providers"

  # BLOCK 2 — BRANDING → PROVIDER
  ROLE_RECLASS_002:
    rule_id: ROLE_RECLASS_002
    namespace: roles.legal
    condition: "roles_raw contains 'Branding'"
    action:
      - "add_role('Provider')"
      - "provider_assigned = true"
    notes: "Placing under own name counts as provider"

  # BLOCK 3 — MARKET PLACER → PROVIDER
  ROLE_RECLASS_003:
    rule_id: ROLE_RECLASS_003
    namespace: roles.legal
    condition: "roles_raw contains 'Market_Placer'"
    action:
      - "add_role('Provider')"
      - "provider_assigned = true"
    notes: "Anyone placing on market is a provider (Art. 16)"

  # BLOCK 4 — PRODUCT MANUFACTURER (SAFETY COMPONENT) → PROVIDER
  ROLE_RECLASS_004:
    rule_id: ROLE_RECLASS_004
    namespace: roles.legal
    inputs: [ai_is_safety_component]
    condition: "roles_raw contains 'Product_Manufacturer' AND ai_is_safety_component == true"
    action:
      - "add_role('Provider')"
      - "provider_assigned = true"
    notes: "Article 24 — manufacturers become providers for AI safety components"

  # BLOCK 5 — IMPORTER WHO REBRANDS → PROVIDER
  ROLE_RECLASS_005:
    rule_id: ROLE_RECLASS_005
    namespace: roles.legal
    inputs: [placing_under_own_name]
    condition: "roles_raw contains 'Importer' AND placing_under_own_name == true"
    action:
      - "add_role('Provider')"
      - "provider_assigned = true"
    notes: "Article 25"

  # BLOCK 6 — DISTRIBUTOR WHO REBRANDS → PROVIDER
  ROLE_RECLASS_006:
    rule_id: ROLE_RECLASS_006
    namespace: roles.legal
    inputs: [placing_under_own_name]
    condition: "roles_raw contains 'Distributor' AND placing_under_own_name == true"
    action:
      - "add_role('Provider')"
      - "provider_assigned = true"
    notes: "Article 26"

  # BLOCK 7 — DEPLOYER WHO MODIFIES → PROVIDER
  ROLE_RECLASS_007:
    rule_id: ROLE_RECLASS_007
    namespace: roles.legal
    inputs: [roles_raw, modifications]
    condition: "roles_raw contains 'Deployer' AND modifications intersects ['substantial_modification','new_intended_purpose','fine_tuning','retraining']"
    action:
      - "add_role('Provider')"
      - "provider_assigned = true"
    notes: "Article 16(2)"

  # BLOCK 8 — NON‑MODIFYING DEPLOYER RETAINS DEPLOYER ROLE
  ROLE_RECLASS_008:
    rule_id: ROLE_RECLASS_008
    namespace: roles.legal
    inputs: [roles_raw, provider_assigned]
    condition: "roles_raw contains 'Deployer' AND provider_assigned == false"
    action: "add_role('Deployer')"
    notes: "Article 29"

  # BLOCK 9 — IMPORTER (UNBRANDED)
  ROLE_RECLASS_009:
    rule_id: ROLE_RECLASS_009
    namespace: roles.legal
    inputs: [roles_raw, provider_assigned]
    condition: "roles_raw contains 'Importer' AND provider_assigned == false"
    action: "add_role('Importer')"

  # BLOCK 10 — DISTRIBUTOR (UNBRANDED)
  ROLE_RECLASS_010:
    rule_id: ROLE_RECLASS_010
    namespace: roles.legal
    inputs: [roles_raw, provider_assigned]
    condition: "roles_raw contains 'Distributor' AND provider_assigned == false"
    action: "add_role('Distributor')"

  # BLOCK 11 — PRODUCT MANUFACTURER (NOT SAFETY COMPONENT)
  ROLE_RECLASS_011:
    rule_id: ROLE_RECLASS_011
    namespace: roles.legal
    inputs: [roles_raw, ai_is_safety_component]
    condition: "roles_raw contains 'Product_Manufacturer' AND ai_is_safety_component == false"
    action: "add_role('Product_Manufacturer')"

  # BLOCK 12 — FINAL CONSOLIDATION
  ROLE_RECLASS_012:
    rule_id: ROLE_RECLASS_012
    namespace: roles.legal
    action: "roles = dedupe(all_assigned_roles)"

  ROLE_RECLASS_013:
    rule_id: ROLE_RECLASS_013
    namespace: roles.legal
    condition: "roles is empty"
    action: "error('Unable to determine legal role.')"
    next: SCREEN_2

  ROLE_RECLASS_014:
    rule_id: ROLE_RECLASS_014
    namespace: roles.legal
    condition: "TRUE"
    action: "display(roles)"
    next: SCREEN_3

  # BLOCK 15 — AUTHORISED REPRESENTATIVE (pass-through)
  ROLE_RECLASS_015:
    rule_id: ROLE_RECLASS_015
    namespace: roles.legal
    inputs: [roles_raw_tags]
    condition: "roles_raw_tags contains 'Authorised_Representative'"
    action: "add_role('Authorised_Representative')"
    notes: "Article 22 — authorised representatives are not reclassified; role passes through as-is"

  ###########################################################
  # MODULE 3 — ANNEX I A (Product Safety)
  ###########################################################

  # NOTE: Screen3 presents product_laws (annexIACategories) and safety_function
  # on a single screen simultaneously. YAML rule sequencing is logical only.
  A1A_001:
    rule_id: A1A_001
    namespace: annex_I_A
    inputs: [answers.annexIACategories]
    condition: "answers.annexIACategories not empty"
    action: proceed
    next: SCREEN_4

  A1A_002:
    rule_id: A1A_002
    namespace: annex_I_A
    inputs: [answers.safety_function]
    condition: "answers.safety_function == 'yes'"
    action:
      classification: "High-risk_Annex_I_A"
    next: SCREEN_8  # = /screen7 (GPAI check)

  A1A_003:
    rule_id: A1A_003
    namespace: annex_I_A
    inputs: [answers.safety_function]
    condition: "answers.safety_function == 'no'"
    next: SCREEN_5  # = /screen4 (Annex IB)

  ###########################################################
  # MODULE 4 — ANNEX I B (Regulated Sectors)
  ###########################################################

  A1B_001:
    rule_id: A1B_001
    namespace: annex_I_B
    inputs: [answers.highRiskSectorsB]
    condition: "answers.highRiskSectorsB not empty"
    action:
      classification: "High-risk_Annex_I_B"
    next: SCREEN_8  # = /screen7 (GPAI check)

  A1B_002:
    rule_id: A1B_002
    namespace: annex_I_B
    inputs: [answers.highRiskSectorsB]
    condition: "answers.highRiskSectorsB empty"
    next: SCREEN_6  # = /screen5 (Annex III)

  ###########################################################
  # MODULE 5 — ANNEX III + SIGNIFICANT IMPACT
  ###########################################################
  # Note: Annex III expanded from 8 high-level categories to 29 specific use cases
  # Categories: Biometrics (3), Critical Infrastructure (1), Education (4),
  # Employment (2), Essential Services (4), Law Enforcement (5),
  # Migration (4), Justice & Democracy (2)

  A3_001:
    rule_id: A3_001
    namespace: annex_III
    inputs: [answers.annexIIIUsecases]
    condition: "answers.annexIIIUsecases empty OR answers.annexIIIUsecases == ['none']"
    action:
      classification: "In-scope_non-high-risk"
    next: SCREEN_8  # = /screen7 (GPAI check)
    notes: "No Annex III use cases selected; 29 specific use cases available"

  A3_002:
    rule_id: A3_002
    namespace: annex_III
    inputs: [answers.annexIIIUsecases]
    condition: "answers.annexIIIUsecases not empty AND answers.annexIIIUsecases != ['none']"
    next: SCREEN_6b  # = /screen6 (Significant Risk check)
    notes: "At least one of 29 Annex III specific use cases selected"

  # ARTICLE 6(3) DEROGATION CHECK  —  Screen6_SignificantRisk.jsx
  # The code implements Article 6(3) derogation conditions, NOT a positive
  # harm-factor checklist. High-risk is the DEFAULT for Annex III systems;
  # a system is non-high-risk only if ALL of the following are true:
  #   (a) a derogation condition applies, AND
  #   (b) the system does not perform profiling.
  #
  # Derogation conditions (answers.significantRiskFactors):
  #   narrow_procedural     — purely preparatory/narrow procedural task
  #   improve_prior_human   — improves result of previously completed human activity
  #   detect_patterns_no_replace — detects patterns, does not replace human assessment
  #   preparatory_task      — intended for preparatory task only
  #   Absence of any condition (or selecting none) → HIGH_RISK
  #
  # Profiling override (answers.profiling):
  #   If answers.profiling == 'yes' → always HIGH_RISK, derogation cannot apply.
  #   Article 6(3) third subparagraph: profiling of natural persons is always significant.

  A3_DEROG_001:
    rule_id: A3_DEROG_001
    namespace: annex_III.significant_risk
    inputs: [answers.profiling]
    condition: "answers.profiling == 'yes'"
    action:
      classification: "High-risk_Annex_III"
    next: SCREEN_8  # = /screen7
    notes: "Article 6(3) third subparagraph — profiling always triggers high-risk regardless of derogation"

  A3_DEROG_002:
    rule_id: A3_DEROG_002
    namespace: annex_III.significant_risk
    inputs: [answers.significantRiskFactors, answers.profiling]
    condition: >
      answers.profiling != 'yes' AND
      answers.significantRiskFactors intersects
        ['narrow_procedural','improve_prior_human','detect_patterns_no_replace','preparatory_task']
    action:
      classification: "annex_iii_non_significant"
    next: SCREEN_8  # = /screen7
    notes: "Article 6(3) — at least one derogation condition applies and no profiling; non-high-risk"

  A3_DEROG_003:
    rule_id: A3_DEROG_003
    namespace: annex_III.significant_risk
    inputs: [answers.significantRiskFactors, answers.profiling]
    condition: >
      answers.profiling != 'yes' AND
      NOT (answers.significantRiskFactors intersects
        ['narrow_procedural','improve_prior_human','detect_patterns_no_replace','preparatory_task'])
    action:
      classification: "High-risk_Annex_III"
    next: SCREEN_8  # = /screen7
    notes: "Article 6(2) — no derogation condition applies; default high-risk under Annex III"

  ###########################################################
  # MODULE 6 — GPAI + SYSTEMIC RISK
  ###########################################################
  # PRELIMINARY: Model relationship determines whether GPAI assessment applies.
  # Screen7 first asks: "What is your relationship to this AI model?"
  #   answers.modelRelationship == 'provider'    → assess GPAI
  #   answers.modelRelationship == 'integrator'  → skip to SCREEN_9
  #   answers.modelRelationship == 'deployer'    → skip to SCREEN_9

  GPAI_000:
    rule_id: GPAI_000
    namespace: gpai
    inputs: [answers.modelRelationship]
    condition: "answers.modelRelationship == 'integrator' OR answers.modelRelationship == 'deployer'"
    next: SCREEN_9  # = /screen9
    notes: "Integrators and deployers of GPAI skip the GPAI model assessment"

  GPAI_001:
    rule_id: GPAI_001
    namespace: gpai
    inputs: [answers.isGPAI]
    condition: "answers.isGPAI == false"
    next: SCREEN_9  # = /screen9

  GPAI_002:
    rule_id: GPAI_002
    namespace: gpai
    inputs: [answers.isGPAI]
    condition: "answers.isGPAI == true"
    next: SCREEN_8b  # = /screen8 (Systemic Risk)

  GPAI_003:
    rule_id: GPAI_003
    namespace: gpai
    inputs: [answers.hasSystemicRisk]
    condition: "answers.hasSystemicRisk == 'yes' OR answers.hasSystemicRisk == 'commission_determined'"
    action: "add_classification('GPAI_systemic_risk')"
    next: SCREEN_9
    notes: |
      Systemic risk determined by:
      1. FLOPs >= 10^25 (1e25 floating-point operations during training), OR
      2. Commission designation based on equivalent high-impact capabilities

      Implementation: Screen8_Systemic.jsx offers three options:
      - "yes" (FLOPS threshold met)
      - "commission_determined" (Commission designated)
      - "no" (neither applies)

      When systemic risk applies, the open-source exception (GPAI_005) does NOT apply;
      full J1-J16 and K1-K13 obligations are assigned regardless of open-source status.

  GPAI_004:
    rule_id: GPAI_004
    namespace: gpai
    inputs: [answers.hasSystemicRisk]
    condition: "answers.hasSystemicRisk == 'no'"
    action: "add_classification('GPAI')"
    next: SCREEN_9
    notes: "Standard GPAI without systemic risk - FLOPS < 10^25 and no Commission designation. See GPAI_005 for open-source obligation reduction."

  GPAI_005:
    rule_id: GPAI_005
    namespace: gpai
    inputs: [answers.isOpenSourceGPAI, answers.hasSystemicRisk]
    condition: "answers.isOpenSourceGPAI == 'yes' AND answers.hasSystemicRisk == 'no'"
    action: "reduce_J_obligations"
    notes: |
      Open-source exception per Article 53(2) and Recital 470.

      Qualifying condition: Model released under free and open-source licence WITH publicly
      available weights, architecture info, and usage info, AND model is not monetised.
      Exception does NOT apply if model presents systemic risk.

      Effect on checklist obligations:
      - EXEMPT: J1-J4 (Article 53(1)(a) technical documentation)
      - EXEMPT: J5  (Article 53(1)(b) information to downstream providers)
      - EXEMPT: J12 (Article 53(1)(a) update documentation)
      - ALWAYS APPLIES: J6 (Article 53(1)(c) copyright compliance policy)
      - ALWAYS APPLIES: J7 (Article 53(1)(d) training data summary)
      - ALWAYS APPLIES: J8-J11, J13-J16 (not covered by the (1)(a)/(b) exception)

      Implementation: Screen14_Checklist.jsx filters J-items inline using
      answers.isOpenSourceGPAI and answers.hasSystemicRisk.

  ###########################################################
  # MODULE 7 — PROHIBITED PRACTICES (WITH ARTICLE 5 EXCEPTIONS)
  ###########################################################

  PROHIB_001:
    rule_id: PROHIB_001
    namespace: prohibited
    inputs: [answers.prohibitedPractices, answers.prohibitedExceptions]
    condition: "answers.prohibitedPractices not empty"
    action: "evaluate_exceptions"
    notes: "Article 5 prohibited practices with exceptions evaluation"
    next: PROHIB_EXCEPTION_EVAL

  PROHIB_EXCEPTION_EVAL:
    rule_id: PROHIB_EXCEPTION_EVAL
    namespace: prohibited
    inputs: [answers.prohibitedPractices, answers.prohibitedExceptions]
    logic: |
      # Check if any selected practice remains prohibited after exception evaluation
      # Practices with exceptions: criminal_risk, emotion_workplace_education, biometric_categorisation, real_time_rbi
      # Exception applies when prohibited_exceptions[practice_id] == true

      truly_prohibited = []

      for practice in answers.prohibitedPractices:
        if practice == 'none':
          continue
        
        # Check if practice has exception and if exception applies
        if practice in ['criminal_risk', 'emotion_workplace_education', 'biometric_categorisation', 'real_time_rbi']:
          # Practice has potential exception - only prohibited if exception evaluated as false
          if answers.prohibitedExceptions.get(practice) == false:
            truly_prohibited.append(practice)
          # If exception == true, practice is NOT prohibited
          # If exception not yet evaluated, require evaluation before proceeding
        else:
          # No exception available for this practice - always prohibited
          truly_prohibited.append(practice)

      if truly_prohibited is not empty:
        classification = "Prohibited"
        next = SCREEN_14  # Skip to checklist (terminal classification)
      else:
        # All practices have valid exceptions or none selected
        # Check if any exceptions were actually applied (need X series documentation)
        applied_exceptions = []
        for practice in answers.prohibitedPractices:
          if practice in ['criminal_risk', 'emotion_workplace_education', 'biometric_categorisation', 'real_time_rbi']:
            if answers.prohibitedExceptions.get(practice) == true:
              applied_exceptions.append(practice)
        
        if applied_exceptions:
          add_obligations('Exemption_Documentation')  # X1-X5 exemption proof requirements
        
        next = SCREEN_10
    notes: |
      Article 5 Exception Logic (IMPLEMENTATION):
      - criminal_risk (Art 5(1)(d)): Exception if system supports human assessment with objective facts
      - emotion_workplace_education (Art 5(1)(f)): Exception if for medical or safety reasons
      - biometric_categorisation (Art 5(1)(g)): Exception if lawful law enforcement dataset labeling
      - real_time_rbi (Art 5(1)(h)): Exception if victim search, threat prevention, or serious crime

      Practices WITHOUT exceptions are ALWAYS prohibited:
      - subliminal (updated: "cause or reasonably likely to cause")
      - vulnerability (updated: "cause or reasonably likely to cause")
      - social_scoring (updated: evaluation/classification based on social behavior)
      - face_scraping (covers both Article 5(1)(e) and 5(2))

      Exception requirements strengthened:
      - criminal_risk: must SUPPLEMENT human assessment with objective facts
      - emotion_workplace_education: must be STRICTLY for medical/safety (not within workplace/education)
      - biometric_categorisation: lawful law enforcement use only
      - real_time_rbi: requires judicial authorization, registration, FRIA, and limitations

      Logic: hasProhibited AND (has_non_exceptionable_practices OR has_exceptionable_practice_with_false_exception)

  PROHIB_002:
    rule_id: PROHIB_002
    namespace: prohibited
    inputs: [answers.prohibitedPractices]
    condition: "answers.prohibitedPractices empty OR answers.prohibitedPractices == ['none']"
    next: SCREEN_10  # = /screen10

  ###########################################################
  # MODULE 8 — TRANSPARENCY + FRIA
  ###########################################################

  TRANS_001:
    rule_id: TRANS_001
    namespace: transparency
    inputs: [answers.transparencyTriggers]
    condition: "TRUE"
    action: "store_for_later"
    next: SCREEN_11  # = /screen11 (FRIA)
    notes: >
      Code always proceeds to SCREEN_11 regardless of role or classification.
      The previously-documented SCREEN_10b (public-authority fast-track) was
      not implemented; Screen10_Transparency.jsx always navigates to /screen11.
      Public_Authority is currently NOT assigned as a legal role by any code path;
      code checks roles.includes('Public_Authority') via isPublicBody in Screen11/Screen14.

  FRIA_001:
    rule_id: FRIA_001
    namespace: fria
    inputs:
      [
        roles,
        classification,
        answers.isPublicBody,
        answers.isPublicServiceProvider,
        answers.deploymentSectors,
        answers.annexIIIUsecases,
        annexIIIPoint,
      ]
    condition: |
      classification contains_any ['High-risk_Annex_I_A','High-risk_Annex_I_B','High-risk_Annex_III']
      AND annexIIIPoint != 2
      AND (
        answers.isPublicBody == true OR
        answers.isPublicServiceProvider == true OR
        answers.deploymentSectors intersects ['biometrics','education','employment','essential_services','law_enforcement','migration_asylum_border','justice'] OR
        answers.annexIIIUsecases intersects ['services_creditworthiness','services_insurance']
      )
    action: "add_obligation('FRIA_required')"
    next: SCREEN_11
    notes: |
      Article 27: Fundamental Rights Impact Assessment requirements:
      1. Public bodies (answers.isPublicBody == true) deploying in any Annex III sector except Point 2
      2. Private entities providing public services (answers.isPublicServiceProvider == true) in any sector except Point 2
      3. Deployment sectors covered — Annex III Points 1, 3-8:
         - biometrics (Point 1), education (Point 3), employment (Point 4),
           essential_services (Point 5), law_enforcement (Point 6),
           migration_asylum_border (Point 7), justice (Point 8)
      4. ALL deployers of Annex III Point 5(b) creditworthiness systems
      5. ALL deployers of Annex III Point 5(c) life/health insurance systems
      EXEMPTION: Annex III Point 2 (Critical Infrastructure) is exempt from FRIA per Article 27(1)
      NOTE: 'Public_Authority' is not a legal role produced by the reclassification engine.
      Public body / public service provider status is captured via Screen11 checkboxes
      (answers.isPublicBody, answers.isPublicServiceProvider) independently of role.

  ###########################################################
  # MODULE 9 — FINAL CLASSIFICATION SUMMARY
  ###########################################################

  CLASS_001:
    rule_id: CLASS_001
    namespace: summary
    condition: "TRUE"
    action: "display(classification)"
    next:
      IF: "classification contains_any ['High-risk_Annex_I_A','High-risk_Annex_I_B','High-risk_Annex_III']"
      THEN: SCREEN_12  # = /screen12 (Final Classification) → /screen13 (Conformity Route)
      ELSE: SCREEN_12  # = /screen12 auto-advances to /screen13 then /screen14 for non-high-risk
    notes: >
      Code always routes through Screen12 and Screen13 before reaching Screen14.
      For non-high-risk systems, Screen13 auto-skips to Screen14 if user is not a Provider.

  ###########################################################
  # MODULE 10 — CONFORMITY ASSESSMENT ROUTING
  ###########################################################

  # FALLBACK: No CA route calculated
  CA_000:
    rule_id: CA_000
    namespace: CA
    condition: "classification contains_any ['High-risk_Annex_I_A','High-risk_Annex_I_B','High-risk_Annex_III'] AND CA_route is undefined"
    action: "CA_route = 'Notified_Body'"
    notes: "Ensures no dead-end in CA routing"

  ###########################################################
  # MODULE 10 — CONFORMITY ASSESSMENT ROUTING (Article 43)
  ###########################################################
  # Article 43 defines conformity assessment procedures based on:
  # - Article 43(3): Annex I (HIGH_RISK_IA) → Follow sectoral legislation
  # - Article 43(2): Annex III points 2-8 (non-biometric) → MUST use internal control (Annex VI)
  # - Article 43(1): Annex III point 1 (biometric) → Choice or mandatory notified body based on standards
  # 
  # Note: HIGH_RISK_IB systems skip Article 43 per Article 2(2) - only Articles 6(1), 102-109, 112 apply

  CA_ARTICLE_43_3:
    rule_id: CA_ARTICLE_43_3
    namespace: CA
    inputs: [classification]
    condition: "classification == 'HIGH_RISK_IA'"
    action: "CA_route = 'Sectoral_Legislation'"
    next: SCREEN_14  # = /screen14
    notes: "Article 43(3) - Follow the conformity assessment procedure required under the relevant sectoral legislation listed in Annex I Section A"

  CA_ARTICLE_2_2_SKIP:
    rule_id: CA_ARTICLE_2_2_SKIP
    namespace: CA
    inputs: [classification]
    condition: "classification == 'HIGH_RISK_IB'"
    action: "skip_screen_13 = true"
    next: SCREEN_14  # = /screen14
    notes: "Article 2(2) - HIGH_RISK_IB systems skip Article 43; only specific articles of the AI Act apply; conformity governed by sectoral legislation"

  CA_ARTICLE_43_1_MANDATORY:
    rule_id: CA_ARTICLE_43_1_MANDATORY
    namespace: CA
    inputs: [classification, isBiometric, answers.conformity_hs_applied]
    condition: "classification == 'HIGH_RISK_III' AND isBiometric == true AND (answers.conformity_hs_applied == 'none' OR answers.conformity_hs_applied == 'partial')"
    action: "CA_route = 'Notified_Body'"
    next: SCREEN_14  # = /screen14
    notes: "Article 43(1) - Annex III point 1 (biometric) MUST use notified body (Annex VII) when HS/CS not fully applied"

  CA_ARTICLE_43_1_CHOICE:
    rule_id: CA_ARTICLE_43_1_CHOICE
    namespace: CA
    inputs: [classification, isBiometric, answers.conformity_hs_applied, answers.conformity_user_choice]
    condition: "classification == 'HIGH_RISK_III' AND isBiometric == true AND answers.conformity_hs_applied == 'full'"
    action: "CA_route = answers.conformity_user_choice"
    next: SCREEN_14  # = /screen14
    notes: "Article 43(1) - Annex III point 1 (biometric) may CHOOSE between Internal Control (Annex VI) or Notified Body (Annex VII) when HS/CS fully applied"

  CA_ARTICLE_43_2:
    rule_id: CA_ARTICLE_43_2
    namespace: CA
    inputs: [classification, isBiometric, answers.conformity_uses_cs]
    condition: "classification == 'HIGH_RISK_III' AND isBiometric == false"
    action: "CA_route = answers.conformity_uses_cs == 'cs' ? 'Internal_Control_CS' : 'Internal_Control'"
    next: SCREEN_14  # = /screen14
    notes: "Article 43(2) - Annex III points 2-8 MUST use internal control (Annex VI); CS variant when harmonised standards are absent"

  ###########################################################\n  # DO NOT DUPLICATE: CA_ARTICLE_2_2_SKIP already defined above\n  ###########################################################\n\n  ###########################################################\n  # MODULE 11 — ROLE + CLASSIFICATION → OBLIGATION SETS\n  ###########################################################

  OBL_001:
    rule_id: OBL_001
    namespace: obligations
    inputs: [roles, classification]
    condition: "roles contains 'Provider' AND classification contains_any ['High-risk_Annex_I_A','High-risk_Annex_I_B','High-risk_Annex_III']"
    action: "add_obligations('Provider')"
    notes: "Provider obligations (A1–A17) per Articles 9–17, 20–22, 43 — gated on high-risk classification"

  OBL_002:
    rule_id: OBL_002
    namespace: obligations
    inputs: [roles, classification]
    condition: "roles contains 'Importer' AND classification contains_any ['High-risk_Annex_I_A','High-risk_Annex_I_B','High-risk_Annex_III']"
    action: "add_obligations('Importer')"
    notes: "Importer obligations (D1–D14) per Article 23 — gated on high-risk classification"

  OBL_003:
    rule_id: OBL_003
    namespace: obligations
    inputs: [roles, classification]
    condition: "roles contains 'Distributor' AND classification contains_any ['High-risk_Annex_I_A','High-risk_Annex_I_B','High-risk_Annex_III']"
    action: "add_obligations('Distributor')"
    notes: "Distributor obligations (E1–E9) per Article 24 — gated on high-risk classification"

  OBL_004:
    rule_id: OBL_004
    namespace: obligations
    inputs: [roles, classification]
    condition: "roles contains 'Deployer' AND classification contains_any ['High-risk_Annex_I_A','High-risk_Annex_I_B','High-risk_Annex_III']"
    action: "add_obligations('Deployer')"
    notes: "Deployer obligations (F1–F14) per Article 26 — gated on high-risk classification"

  OBL_005:
    rule_id: OBL_005
    namespace: obligations
    inputs: [classification, roles]
    condition: "classification contains 'GPAI' AND roles contains 'Provider'"
    action: "add_obligations('GPAI')"
    notes: "GPAI obligations (J1–J16) per Article 53 — apply only to GPAI model PROVIDERS"

  OBL_006:
    rule_id: OBL_006
    namespace: obligations
    inputs: [classification, roles]
    condition: "classification contains 'GPAI_systemic_risk' AND roles contains 'Provider'"
    action: "add_obligations('GPAI_systemic')"
    notes: "GPAI systemic risk obligations (K1–K13) per Article 55 — apply only to GPAI model PROVIDERS"

  OBL_007:
    rule_id: OBL_007
    namespace: obligations
    inputs: [roles, classification, CA_route]
    condition: >
      roles contains 'Provider' AND
      classification contains_any ['High-risk_Annex_I_A','High-risk_Annex_I_B','High-risk_Annex_III']
    action: "add_obligations('Conformity_Assessment:' + CA_route)"
    notes: "Conformity assessment obligations (O1–O50) — ONLY for Providers, per Article 43"

  OBL_008:
    rule_id: OBL_008
    namespace: obligations
    inputs: [answers.transparencyTriggers, roles]
    condition: >
      answers.transparencyTriggers not empty AND
      (roles contains 'Provider' OR roles contains 'Deployer')
    action: "add_obligations('Transparency')"
    notes: "Transparency obligations (H1–H9) per Article 50 — applies to Providers and Deployers"

  OBL_009:
    rule_id: OBL_009
    namespace: obligations
    inputs: [obligations]
    condition: "obligations contains 'FRIA_required'"
    action: "add_obligations('FRIA')"
    notes: |
      FRIA obligations (G1–G15) per Article 27.
      Applies to: public bodies, public service providers, and ALL deployers of
      Annex III Point 5(b) creditworthiness and Point 5(c) insurance systems.

  OBL_010:
    rule_id: OBL_010
    namespace: obligations
    inputs: [classification, roles]
    condition: >
      classification == 'annex_iii_non_significant' AND
      roles contains 'Provider'
    action: "add_obligations('Non_Significant_Risk_Notification')"
    notes: "Non-significant risk notification (I1–I7) per Articles 6(3), 6(4), 49(2) — Provider only"

  OBL_011:
    rule_id: OBL_011
    namespace: obligations
    inputs: [classification, roles]
    condition: "classification == 'Prohibited' AND roles contains 'Provider'"
    action: "add_obligations('Prohibited_Provider')"
    notes: "Prohibited system cessation — Provider obligations (L1–L9) per Article 5"

  OBL_012:
    rule_id: OBL_012
    namespace: obligations
    inputs: [classification, roles]
    condition: "classification == 'Prohibited' AND roles contains 'Importer'"
    action: "add_obligations('Prohibited_Importer')"
    notes: "Prohibited system cessation — Importer must refuse import, notify authorities"

  OBL_013:
    rule_id: OBL_013
    namespace: obligations
    inputs: [classification, roles]
    condition: "classification == 'Prohibited' AND roles contains 'Distributor'"
    action: "add_obligations('Prohibited_Distributor')"
    notes: "Prohibited system cessation — Distributor must refuse distribution, notify authorities"

  OBL_014:
    rule_id: OBL_014
    namespace: obligations
    inputs: [classification, roles]
    condition: "classification == 'Prohibited' AND roles contains 'Deployer'"
    action: "add_obligations('Prohibited_Deployer')"
    notes: "Prohibited system cessation — Deployer must stop deployment, disable system"

  OBL_015:
    rule_id: OBL_015
    namespace: obligations
    inputs: [roles]
    condition: "roles contains 'Product_Manufacturer'"
    action: "add_obligations('Product_Manufacturer')"
    notes: "Product manufacturer obligations (N1–N4) per Article 24 — only if AI is safety component"

  OBL_016:
    rule_id: OBL_016
    namespace: obligations
    inputs: [classification, roles]
    condition: "classification == 'Prohibited' AND roles contains 'Product_Manufacturer'"
    action: "add_obligations('Prohibited_Product_Manufacturer')"
    notes: "Prohibited product manufacturer obligations (P1–P4) per Articles 5 & 24 — special obligations when prohibited AI integrated as safety component"

  OBL_017:
    rule_id: OBL_017
    namespace: obligations
    inputs: [roles, classification]
    condition: >
      roles contains 'Provider' AND
      classification contains_any ['High-risk_Annex_I_A','High-risk_Annex_I_B','High-risk_Annex_III']
    action: "add_obligations('Handover')"
    notes: "Handover obligations (C1–C15) per Articles 13, 16, 23 — Provider must provide documentation to downstream actors for high-risk systems"

  OBL_018:
    rule_id: OBL_018
    namespace: obligations
    inputs: [classification]
    condition: "classification == 'Excluded'"
    action: "add_obligations('Exclusion_Documentation')"
    notes: "Exclusion documentation obligations (M1–M5) per Article 2 — Required even for excluded systems to document exclusion basis"

  OBL_019:
    rule_id: OBL_019
    namespace: obligations
    inputs: [prohibited_exceptions, prohibited_actions]
    condition: >
      prohibited_exceptions contains_any ['criminal_risk', 'emotion_workplace_education', 'biometric_categorisation', 'real_time_rbi'] AND
      any(prohibited_exceptions[practice] == true for practice in prohibited_actions)
    action: "add_obligations('Exemption_Documentation')"
    notes: "Exemption documentation obligations (X1–X5) per Article 5 & Recital 16 — Required when claiming exemptions from prohibited practices"

  OBL_020:
    rule_id: OBL_020
    namespace: obligations
    inputs: [system_features]
    condition: "system_features contains 'ancillary_feature'"
    action: "add_obligations('Exemption_Documentation')"
    notes: "Ancillary feature documentation (X5) per Recital 16 — Required when claiming ancillary feature exemption"

  OBL_021:
    rule_id: OBL_021
    namespace: obligations
    inputs: [roles]
    condition: "roles contains 'Authorised_Representative'"
    action: "add_obligations('Authorised_Representative')"
    notes: "Authorised representative obligations (R-series) per Article 22 — applies only to entities acting as AR for an EU-external provider"

  ###########################################################
  # MODULE 12 — OUTPUT CHECKLIST
  ###########################################################

  OUTPUT_001:
    rule_id: OUTPUT_001
    namespace: output
    condition: "TRUE"
    action: "render(all_obligations)"
    next: END

